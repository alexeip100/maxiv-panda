[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxiv-panda"
version = "0.12.1"
description = "PANDA: Python software for visualization, processing, analysis, and fitting of PES/XPS data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alexei Preobrajenski" }
]
keywords = ["PES", "XPS", "photoemission", "photoelectron spectroscopy", "spectroscopy", "MAX IV"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PyQt6>=6.8",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "igor2>=0.5.12",
    "scipy>=1.13",
    "lmfit>=1.3",
    "h5py>=3.10",
]

[project.urls]
Repository = "https://github.com/alexeip100/maxiv-panda"
Issues = "https://github.com/alexeip100/maxiv-panda/issues"

[project.scripts]
panda = "maxiv_panda.app:main"
maxiv-panda = "maxiv_panda.app:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maxiv_panda = ["docs/*.md", "data/signal_references/*.json", "data/*.h5", "data/*.ico", "data/*.icns", "data/*.png"]
